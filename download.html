<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/secured/icons/logo.png">
    <link rel="apple-touch-icon" href="assets/secured/icons/logo.png">
    <meta name="theme-color" content="#6ec5ff">
    <title>Install App</title>
</head>
<body>
    <nav class="navbar">
        <a class="navlogo" href="index.html">
            Children's Ministry
        </a>
    </nav>

    <section class="hero-banner">
        <div class="hero-copy">
            <p class="hero-tag">Install the app</p>
            <h1>Get the app</h1>
            <img src="assets/secured/icons/logo.png" alt="Children's Ministry logo" style="width:120px;max-width:100%;border-radius:24px;margin:1.5rem auto;display:block;box-shadow:0 14px 30px rgba(31,59,98,0.18);">
            <p>Save the app on your device for easy access.</p>
            <button class="primary-button" id="install-app-btn" type="button" style="display:none;">Install App</button>
        </div>
    </section>

    <div id="verse-modal" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="verse-modal-title">
            <h3 id="verse-modal-title">Verse</h3>
            <div class="verse-embed">
                <iframe id="verse-iframe" src="about:blank" title="Bible verse popup" loading="lazy" allowfullscreen></iframe>
            </div>
            <div class="modal-actions">
                <button type="button" class="cancel-btn" id="verse-close-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="js/sw-register.js"></script>
    <script type="module" src="js/streak.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children's Ministry | Events</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #4A90E2;
            --warm-orange: #F5A623;
            --vibrant-green: #7ED321;
            --danger-red: #D0021B;
            --bg-color: #F9FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #333333;
            --text-light: #FFFFFF;
            --border-color: #E2E8F0;
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }

        /* Loader */
        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .loader {
            width: 50px; height: 50px; border: 6px solid #F8E71C;
            border-top-color: var(--primary-blue); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Navigation */
        header { background-color: var(--card-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        nav { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--primary-blue); letter-spacing: 1px; }
        .logo span { color: var(--warm-orange); }
        
        .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
        .nav-links a { font-weight: 700; transition: color var(--transition-speed); }
        .nav-links a:hover { color: var(--primary-blue); }
        .btn-account { background-color: var(--primary-blue); color: var(--text-light) !important; padding: 0.5rem 1.2rem; border-radius: 25px; }

        /* Hamburger Toggle Button Styling */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }
        .hamburger span {
            width: 100%;
            height: 3px;
            background-color: var(--primary-blue);
            border-radius: 3px;
            transition: all var(--transition-speed) ease;
        }

        /* Main Container */
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .page-header h1 { font-size: 2.2rem; font-weight: 900; color: var(--primary-blue); }

        /* Teacher Upload Panel */
        .teacher-panel {
            background: var(--card-bg);
            border: 2px dashed var(--primary-blue);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3rem;
            display: none; 
            box-shadow: 0 8px 20px rgba(74,144,226,0.08);
        }

        .teacher-panel h2 {
            color: var(--primary-blue);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .teacher-panel p.sub-text {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-dark); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary-blue);
        }

        .file-upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            background: #F8FAFC;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .file-upload-zone:hover { border-color: var(--warm-orange); background: #FFFDF9; }
        .file-upload-zone input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; top: 0; left: 0; }
        
        .preview-img {
            max-width: 100%;
            max-height: 160px;
            border-radius: 8px;
            object-fit: cover;
            display: none;
        }

        .btn-publish {
            grid-column: span 2;
            background-color: var(--vibrant-green);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 25px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-publish:hover { background-color: #6bb51c; transform: translateY(-2px); }
        .btn-publish:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        .event-banner {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #E2E8F0;
        }

        .event-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
        .event-tag {
            align-self: flex-start;
            background: rgba(74,144,226,0.15);
            color: var(--primary-blue);
            font-weight: 800;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            margin-bottom: 0.8rem;
        }
        .event-title { font-size: 1.3rem; font-weight: 900; color: var(--text-dark); margin-bottom: 0.5rem; }
        .event-date { font-size: 0.9rem; font-weight: 700; color: var(--warm-orange); margin-bottom: 0.8rem; }
        .event-desc { font-size: 0.95rem; color: #555; line-height: 1.5; flex: 1; }

        .btn-delete-event {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(208, 2, 27, 0.9);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background-color: var(--text-dark); color: white; padding: 1rem 1.5rem; border-radius: 8px; font-weight: 600; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
        .toast.success { border-left: 5px solid var(--vibrant-green); }
        .toast.error { border-left: 5px solid var(--danger-red); }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* Responsive Styles for Mobile Screens */
        @media (max-width: 768px) {
            .upload-grid { grid-template-columns: 1fr; }
            .btn-publish { grid-column: span 1; }

            /* Show Hamburger icon */
            .hamburger { display: flex; }

            /* Transform .nav-links into a mobile overlay dropdown menu */
            .nav-links {
                position: fixed;
                top: 70px; /* Adjust depending on header height */
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background-color: var(--card-bg);
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                padding-top: 3rem;
                gap: 2rem;
                transition: left var(--transition-speed) ease;
                box-shadow: 0 10px 10px rgba(0,0,0,0.05);
            }

            /* Active state toggled via JS */
            .nav-links.active {
                left: 0;
            }

            /* Animate Hamburger into an 'X' shape when active */
            .hamburger.active span:nth-child(1) {
                transform: translateY(9px) rotate(45deg);
            }
            .hamburger.active span:nth-child(2) {
                opacity: 0;
            }
            .hamburger.active span:nth-child(3) {
                transform: translateY(-9px) rotate(-45deg);
            }
        }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="loader"></div>
    </div>

    <header>
        <nav>
            <div class="logo">Children's <span>Ministry</span></div>
            
            <!-- Hamburger Toggle Button -->
            <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html" style="color: var(--primary-blue);">Events</a></li>
                <li><a href="division.html">Division</a></li>
                <li><a href="grow.html">Farm</a></li>
                <li><a href="account.html" class="btn-account" id="nav-account">My Account</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>Upcoming Ministry Events</h1>
            <span id="role-badge" style="background: #E2E8F0; padding: 0.4rem 1rem; border-radius: 20px; font-weight: 700; font-size: 0.85rem; color: #555;">Checking access...</span>
        </div>

        <section class="teacher-panel" id="teacher-panel">
            <h2>Teacher Event Creation Control</h2>
            <p class="sub-text">Upload new events here. Students will immediately see these on their event feed.</p>
            
            <form id="form-upload-event">
                <div class="upload-grid">
                    <div>
                        <div class="form-group">
                            <label for="event-title">Event Title</label>
                            <input type="text" id="event-title" required placeholder="e.g. Vacation Bible School 2026">
                        </div>
                        <div class="form-group">
                            <label for="event-date">Event Date & Time</label>
                            <input type="datetime-local" id="event-date" required>
                        </div>
                        <div class="form-group">
                            <label for="event-target">Target Division</label>
                            <select id="event-target">
                                <option value="All Divisions">All Divisions</option>
                                <option value="Beginner">Beginner</option>
                                <option value="Primary">Primary</option>
                                <option value="Middler">Middler</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <div class="form-group">
                            <label>Event Poster Image</label>
                            <div class="file-upload-zone" id="drop-zone">
                                <span id="upload-prompt">Click or drag an image here (Max 2MB)</span>
                                <img id="preview-img" class="preview-img" alt="Event Preview">
                                <input type="file" id="event-image" accept="image/png, image/jpeg, image/jpg" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="event-desc">Event Description</label>
                            <textarea id="event-desc" rows="3" required placeholder="Describe what the students should bring or expect..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-publish" id="btn-publish">Publish Event</button>
                </div>
            </form>
        </section>

        <div class="events-grid" id="events-grid">
        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        // Hamburger Menu Interactivity Script
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        // Close menu automatically when clicking any nav link on mobile
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navLinks.classList.remove('active');
            });
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getDatabase, ref as dbRef, get, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsMaPJEXjJt4pMtJYeuZB7m1J2RjARqrU",
            authDomain: "children-department-ab045.firebaseapp.com",
            databaseURL: "https://children-department-ab045-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "children-department-ab045",
            storageBucket: "children-department-ab045.firebasestorage.app",
            messagingSenderId: "284100421486",
            appId: "1:284100421486:web:fc56c486487099662b037f",
            measurementId: "G-NNTTMWCQKK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Security Utility: Escape HTML to prevent XSS
        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        let currentUserRole = 'Student';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const imageInput = document.getElementById('event-image');
        const previewImg = document.getElementById('preview-img');
        const uploadPrompt = document.getElementById('upload-prompt');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    showToast("Image file size must be less than 2MB", "error");
                    imageInput.value = "";
                    return;
                }
                previewImg.src = URL.createObjectURL(file);
                previewImg.style.display = 'block';
                uploadPrompt.style.display = 'none';
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace('login.html');
                return;
            }

            try {
                const snapshot = await get(dbRef(db, `users/${user.uid}`));
                if (snapshot.exists()) {
                    currentUserRole = snapshot.val().role || 'Student';
                }

                document.getElementById('role-badge').textContent = `Role: ${currentUserRole}`;

                if (currentUserRole === 'Teacher') {
                    document.getElementById('teacher-panel').style.display = 'block';
                }

                listenForEvents();
            } catch (error) {
                console.error("Role Verification Error:", error);
            } finally {
                const loader = document.getElementById('loader-wrapper');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        });

        document.getElementById('form-upload-event').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (currentUserRole !== 'Teacher') {
                showToast("Unauthorized: Only teachers can publish events.", "error");
                return;
            }

            const btn = document.getElementById('btn-publish');
            const title = document.getElementById('event-title').value.trim();
            const dateStr = document.getElementById('event-date').value;
            const target = document.getElementById('event-target').value;
            const desc = document.getElementById('event-desc').value.trim();
            const file = imageInput.files[0];

            btn.disabled = true;
            btn.textContent = "Uploading Poster & Creating Event...";

            try {
                const fileRef = storageRef(storage, `events/${Date.now()}_${file.name}`);
                await uploadBytes(fileRef, file);
                const imageUrl = await getDownloadURL(fileRef);

                const eventsListRef = dbRef(db, 'events');
                const newEventRef = push(eventsListRef);

                await set(newEventRef, {
                    title: title,
                    date: dateStr,
                    targetDivision: target,
                    description: desc,
                    imageUrl: imageUrl,
                    createdAt: new Date().toISOString()
                });

                showToast("Event successfully published!");
                
                document.getElementById('form-upload-event').reset();
                previewImg.style.display = 'none';
                uploadPrompt.style.display = 'inline';
            } catch (error) {
                console.error("Upload Error:", error);
                showToast("Failed to upload event.", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Publish Event";
            }
        });

        function listenForEvents() {
            const eventsGrid = document.getElementById('events-grid');
            const eventsDbRef = dbRef(db, 'events');

            onValue(eventsDbRef, (snapshot) => {
                eventsGrid.innerHTML = "";

                if (!snapshot.exists()) {
                    eventsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888;">No events posted yet.</p>`;
                    return;
                }

                const data = snapshot.val();
                
                Object.entries(data).reverse().forEach(([key, item]) => {
                    const formattedDate = new Date(item.date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
                    
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    
                    card.innerHTML = `
                        ${currentUserRole === 'Teacher' ? `<button class="btn-delete-event" data-id="${escapeHTML(key)}">Delete</button>` : ''}
                        <img src="${escapeHTML(item.imageUrl)}" alt="${escapeHTML(item.title)}" class="event-banner">
                        <div class="event-body">
                            <span class="event-tag">${escapeHTML(item.targetDivision)}</span>
                            <h3 class="event-title">${escapeHTML(item.title)}</h3>
                            <div class="event-date">${escapeHTML(formattedDate)}</div>
                            <p class="event-desc">${escapeHTML(item.description)}</p>
                        </div>
                    `;

                    eventsGrid.appendChild(card);
                });

                if (currentUserRole === 'Teacher') {
                    document.querySelectorAll('.btn-delete-event').forEach(button => {
                        button.addEventListener('click', async (e) => {
                            const id = e.target.getAttribute('data-id');
                            if (confirm("Are you sure you want to delete this event?")) {
                                try {
                                    await remove(dbRef(db, `events/${id}`));
                                    showToast("Event deleted.");
                                } catch (err) {
                                    showToast("Failed to delete event.", "error");
                                }
                            }
                        });
                    });
                }
            });
        }
    </script>
</body>
</html>
